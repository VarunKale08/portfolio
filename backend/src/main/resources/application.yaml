spring:
  application:
    name: portfolio-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      lifecycle-management: start-only

app:
  cors:
    allowed-origins: http://localhost:5173
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    to: ${CONTACT_EMAIL_TO:}